[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-bench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "jsonschema>=4.23"]

[tool.setuptools]
packages = ["persona_bench"]

[tool.pytest.ini_options]
testpaths = ["persona_bench/tests"]
asyncio_mode = "auto"
